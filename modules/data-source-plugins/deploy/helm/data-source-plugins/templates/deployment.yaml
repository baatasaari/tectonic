apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-data-source-plugins
  labels:
    app.kubernetes.io/name: data-source-plugins
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: data-source-plugins
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-source-plugins
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-data-source-plugins
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: data-source-plugins
              app.kubernetes.io/instance: {{ .Release.Name }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: data-source-plugins
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8087
          env:
            - name: DATA_SOURCE_PLUGINS_TENANT_ID
              value: {{ .Values.config.tenantId | quote }}
            - name: DATA_SOURCE_PLUGINS_MULTI_TENANCY_BASE_URL
              value: {{ .Values.multiTenancyBaseUrl | quote }}
            - name: DATA_SOURCE_PLUGINS_TELEMETRY__LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: DATA_SOURCE_PLUGINS_TELEMETRY__OTLP_ENDPOINT
              value: {{ .Values.config.otlpEndpoint | quote }}
            - name: DATA_SOURCE_PLUGINS_DRIFT__AUTO_ADAPT_ENABLED
              value: {{ .Values.config.driftAutoAdaptEnabled | quote }}
            - name: DATA_SOURCE_PLUGINS_QUALITY__QUALITY_GATE_THRESHOLD
              value: {{ .Values.config.qualityGateThreshold | quote }}
            - name: DATA_SOURCE_PLUGINS_SECRETS_AND_CREDENTIAL_MANAGEMENT_BASE_URL
              value: {{ .Values.secretsAndCredentialManagementBaseUrl | quote }}
            {{- if .Values.database.existingSecret }}
            - name: DATA_SOURCE_PLUGINS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- else }}
            - name: DATA_SOURCE_PLUGINS_DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
