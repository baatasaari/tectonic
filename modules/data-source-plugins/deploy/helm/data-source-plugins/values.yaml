image:
  repository: tectonic/data-source-plugins
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 3

resources:
  requests:
    cpu: "1"
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

service:
  type: ClusterIP
  port: 8087

config:
  tenantId: "default"
  logLevel: "INFO"
  otlpEndpoint: "http://tempo:4317"
  driftAutoAdaptEnabled: true
  qualityGateThreshold: 0.6

database:
  url: "postgresql+asyncpg://data_source_plugins:data_source_plugins@postgres:5432/data_source_plugins"
  existingSecret: ""
  existingSecretKey: "database-url"

secretsAndCredentialManagementBaseUrl: "http://secrets-and-credential-management:8111"

podDisruptionBudget:
  minAvailable: 2

livenessProbe:
  httpGet:
    path: /healthz
    port: 8087
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: 8087
  initialDelaySeconds: 5
  periodSeconds: 10
