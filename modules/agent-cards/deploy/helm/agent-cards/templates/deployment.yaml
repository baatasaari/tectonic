apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-agent-cards
  labels:
    app.kubernetes.io/name: agent-cards
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-cards
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-cards
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-agent-cards
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agent-cards
              app.kubernetes.io/instance: {{ .Release.Name }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agent-cards
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8102
          env:
            - name: AGENT_CARDS_TENANT_ID
              value: {{ .Values.config.tenantId | quote }}
            - name: AGENT_CARDS_TELEMETRY__LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: AGENT_CARDS_TELEMETRY__OTLP_ENDPOINT
              value: {{ .Values.config.otlpEndpoint | quote }}
            - name: AGENT_CARDS_PERFORMANCE_WEIGHT
              value: {{ .Values.config.performanceWeight | quote }}
            - name: AGENT_CARDS_COMPLIANCE_WEIGHT
              value: {{ .Values.config.complianceWeight | quote }}
            - name: AGENT_CARDS_COMPLIANCE_FRAMEWORK_NAME
              value: {{ .Values.config.complianceFrameworkName | quote }}
            - name: AGENT_CARDS_CARD_STALENESS_TTL_SECONDS
              value: {{ .Values.config.cardStalenessTtlSeconds | quote }}
            - name: AGENT_CARDS_EVALUATION_FRAMEWORK_BASE_URL
              value: {{ .Values.evaluationFrameworkBaseUrl | quote }}
            - name: AGENT_CARDS_REGULATORY_COMPLIANCE_BASE_URL
              value: {{ .Values.regulatoryComplianceBaseUrl | quote }}
            - name: AGENT_CARDS_MULTI_TENANCY_BASE_URL
              value: {{ .Values.multiTenancyBaseUrl | quote }}
            - name: AGENT_CARDS_ENTITLEMENT_GATE_CACHE_TTL_SECONDS
              value: {{ .Values.config.entitlementGateCacheTtlSeconds | quote }}
            - name: AGENT_CARDS_ENTITLEMENT_GATE_MAX_STALENESS_SECONDS
              value: {{ .Values.config.entitlementGateMaxStalenessSeconds | quote }}
            {{- if .Values.database.existingSecret }}
            - name: AGENT_CARDS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- else }}
            - name: AGENT_CARDS_DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
