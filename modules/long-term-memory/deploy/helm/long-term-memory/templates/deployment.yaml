apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-long-term-memory
  labels:
    app.kubernetes.io/name: long-term-memory
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: long-term-memory
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: long-term-memory
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: long-term-memory
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8092
          env:
            - name: LONG_TERM_MEMORY_TENANT_ID
              value: {{ .Values.config.tenantId | quote }}
            - name: LONG_TERM_MEMORY_TELEMETRY__LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: LONG_TERM_MEMORY_TELEMETRY__OTLP_ENDPOINT
              value: {{ .Values.config.otlpEndpoint | quote }}
            - name: LONG_TERM_MEMORY_CONSOLIDATION__DECAY_THRESHOLD
              value: {{ .Values.config.decayThreshold | quote }}
            - name: LONG_TERM_MEMORY_REFLECTION__ENABLED
              value: {{ .Values.config.reflectionEnabled | quote }}
            - name: LONG_TERM_MEMORY_CROSS_AGENT_SHARING__ENABLED
              value: {{ .Values.config.crossAgentSharingEnabled | quote }}
            - name: LONG_TERM_MEMORY_ERASURE__SLA_HOURS
              value: {{ .Values.config.erasureSlaHours | quote }}
            {{- if .Values.dependencyStubBaseUrl }}
            - name: LONG_TERM_MEMORY_DEPENDENCY_STUB_BASE_URL
              value: {{ .Values.dependencyStubBaseUrl | quote }}
            {{- end }}
            {{- if .Values.database.existingSecret }}
            - name: LONG_TERM_MEMORY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- else }}
            - name: LONG_TERM_MEMORY_DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
