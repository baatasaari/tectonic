apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-identity-and-access
  labels:
    app.kubernetes.io/name: identity-and-access
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-and-access
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-and-access
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: identity-and-access
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8110
          env:
            - name: IDENTITY_ACCESS_TENANT_ID
              value: {{ .Values.config.tenantId | quote }}
            - name: IDENTITY_ACCESS_TELEMETRY__LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: IDENTITY_ACCESS_TELEMETRY__OTLP_ENDPOINT
              value: {{ .Values.config.otlpEndpoint | quote }}
            - name: IDENTITY_ACCESS_TOKEN_DEFAULT_TTL_SECONDS
              value: {{ .Values.config.tokenDefaultTtlSeconds | quote }}
            - name: IDENTITY_ACCESS_AUDITABILITY_BASE_URL
              value: {{ .Values.auditabilityBaseUrl | quote }}
            {{- if .Values.tokenSigningSecret.existingSecret }}
            - name: IDENTITY_ACCESS_TOKEN_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tokenSigningSecret.existingSecret }}
                  key: {{ .Values.tokenSigningSecret.existingSecretKey }}
            {{- else }}
            - name: IDENTITY_ACCESS_TOKEN_SIGNING_SECRET
              value: {{ .Values.tokenSigningSecret.value | quote }}
            {{- end }}
            {{- if .Values.database.existingSecret }}
            - name: IDENTITY_ACCESS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- else }}
            - name: IDENTITY_ACCESS_DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
