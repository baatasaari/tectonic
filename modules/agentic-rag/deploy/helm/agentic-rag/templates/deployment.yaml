apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-agentic-rag
  labels:
    app.kubernetes.io/name: agentic-rag
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agentic-rag
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-rag
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: agentic-rag
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8085
          env:
            - name: AGENTIC_RAG_TENANT_ID
              value: {{ .Values.config.tenantId | quote }}
            - name: AGENTIC_RAG_TELEMETRY__LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: AGENTIC_RAG_TELEMETRY__OTLP_ENDPOINT
              value: {{ .Values.config.otlpEndpoint | quote }}
            - name: AGENTIC_RAG_RETRIEVAL__MAX_HOPS
              value: {{ .Values.config.maxHops | quote }}
            - name: AGENTIC_RAG_RETRIEVAL__GROUNDEDNESS_THRESHOLD
              value: {{ .Values.config.groundednessThreshold | quote }}
            - name: AGENTIC_RAG_CRITIC__METHOD
              value: {{ .Values.config.criticMethod | quote }}
            - name: AGENTIC_RAG_VECTOR_DB_BASE_URL
              value: {{ .Values.vectorDbBaseUrl | quote }}
            - name: AGENTIC_RAG_GRAPH_DB_BASE_URL
              value: {{ .Values.graphDbBaseUrl | quote }}
            - name: AGENTIC_RAG_KNOWLEDGE_BASE_BASE_URL
              value: {{ .Values.knowledgeBaseBaseUrl | quote }}
            - name: AGENTIC_RAG_LLM_GATEWAY_BASE_URL
              value: {{ .Values.llmGatewayBaseUrl | quote }}
            {{- if .Values.database.existingSecret }}
            - name: AGENTIC_RAG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- else }}
            - name: AGENTIC_RAG_DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
