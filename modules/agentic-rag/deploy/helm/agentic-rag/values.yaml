image:
  repository: tectonic/agentic-rag
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 3

resources:
  requests:
    cpu: "1"
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

service:
  type: ClusterIP
  port: 8085

config:
  tenantId: "default"
  logLevel: "INFO"
  otlpEndpoint: "http://tempo:4317"
  maxHops: 3
  groundednessThreshold: 0.85
  criticMethod: "llm"

database:
  url: "postgresql+asyncpg://agentic_rag:agentic_rag@postgres:5432/agentic_rag"
  existingSecret: ""
  existingSecretKey: "database-url"

vectorDbBaseUrl: "http://vector-db:8089"
graphDbBaseUrl: "http://graph-db:8090"
knowledgeBaseBaseUrl: "http://knowledge-base:8088"
llmGatewayBaseUrl: "http://llm-gateway:8082"

podDisruptionBudget:
  minAvailable: 2

livenessProbe:
  httpGet:
    path: /healthz
    port: 8085
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: 8085
  initialDelaySeconds: 5
  periodSeconds: 10
