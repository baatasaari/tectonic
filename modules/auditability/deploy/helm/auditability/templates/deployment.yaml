apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-auditability
  labels:
    app.kubernetes.io/name: auditability
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: auditability
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auditability
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: auditability
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8099
          env:
            - name: AUDITABILITY_TENANT_ID
              value: {{ .Values.config.tenantId | quote }}
            - name: AUDITABILITY_TELEMETRY__LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: AUDITABILITY_TELEMETRY__OTLP_ENDPOINT
              value: {{ .Values.config.otlpEndpoint | quote }}
            - name: AUDITABILITY_AUDIT_PACK__OUTPUT_FORMAT
              value: {{ .Values.config.auditPackOutputFormat | quote }}
            - name: AUDITABILITY_NL_QUERY__ENABLED
              value: {{ .Values.config.nlQueryEnabled | quote }}
            {{- if .Values.dependencyStubBaseUrl }}
            - name: AUDITABILITY_DEPENDENCY_STUB_BASE_URL
              value: {{ .Values.dependencyStubBaseUrl | quote }}
            {{- end }}
            {{- if .Values.database.existingSecret }}
            - name: AUDITABILITY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- else }}
            - name: AUDITABILITY_DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
