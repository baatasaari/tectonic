apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-observability
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: observability
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: observability
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-observability
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: observability
              app.kubernetes.io/instance: {{ .Release.Name }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: observability
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8098
          env:
            - name: OBSERVABILITY_TENANT_ID
              value: {{ .Values.config.tenantId | quote }}
            - name: OBSERVABILITY_MULTI_TENANCY_BASE_URL
              value: {{ .Values.multiTenancyBaseUrl | quote }}
            - name: OBSERVABILITY_TELEMETRY__LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: OBSERVABILITY_TELEMETRY__OTLP_ENDPOINT
              value: {{ .Values.config.otlpEndpoint | quote }}
            - name: OBSERVABILITY_REASONING_NARRATIVE__ENABLED
              value: {{ .Values.config.reasoningNarrativeEnabled | quote }}
            - name: OBSERVABILITY_COST_ATTRIBUTION__ENABLED
              value: {{ .Values.config.costAttributionEnabled | quote }}
            - name: OBSERVABILITY_RETENTION__TRACES_DAYS
              value: {{ .Values.config.tracesRetentionDays | quote }}
            - name: OBSERVABILITY_LLM_GATEWAY_BASE_URL
              value: {{ .Values.llmGatewayBaseUrl | quote }}
            {{- if .Values.database.existingSecret }}
            - name: OBSERVABILITY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- else }}
            - name: OBSERVABILITY_DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
