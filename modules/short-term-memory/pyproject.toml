[project]
name = "short-term-memory"
version = "0.1.0"
description = "Tectonic Agentic AI Platform — Module 12: Short-Term Memory. Token-budgeted session buffer with salience-weighted retention."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "redis>=5.0",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
  "httpx>=0.27",
  "tenacity>=9.0",
  "aiobreaker>=1.2",
  "pyjwt>=2.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "fakeredis>=2.24",
  "respx>=0.21",
  "ruff>=0.7",
  "schemathesis>=3.35",
  "testcontainers[redis]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/short_term_memory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
