apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-billing-and-metering
  labels:
    app.kubernetes.io/name: billing-and-metering
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-and-metering
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-and-metering
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: billing-and-metering
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8112
          env:
            - name: BILLING_TENANT_ID
              value: {{ .Values.config.tenantId | quote }}
            - name: BILLING_TELEMETRY__LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: BILLING_TELEMETRY__OTLP_ENDPOINT
              value: {{ .Values.config.otlpEndpoint | quote }}
            - name: BILLING_FINOPS_BASE_URL
              value: {{ .Values.finopsBaseUrl | quote }}
            - name: BILLING_AUDITABILITY_BASE_URL
              value: {{ .Values.auditabilityBaseUrl | quote }}
            {{- if .Values.database.existingSecret }}
            - name: BILLING_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- else }}
            - name: BILLING_DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
