image:
  repository: tectonic/regulatory-compliance
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: "500m"
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

service:
  type: ClusterIP
  port: 8096

config:
  tenantId: "default"
  logLevel: "INFO"
  otlpEndpoint: "http://tempo:4317"
  evidenceOutputFormat: "pdf"

database:
  url: "postgresql+asyncpg://regcomp:regcomp@postgres:5432/regcomp"
  existingSecret: ""
  existingSecretKey: "database-url"

dependencyStubBaseUrl: ""  # set to the real Auditability URL once Module 20 is deployed

podDisruptionBudget:
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /healthz
    port: 8096
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: 8096
  initialDelaySeconds: 5
  periodSeconds: 10
