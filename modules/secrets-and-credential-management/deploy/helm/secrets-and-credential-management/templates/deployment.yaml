apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-secrets-and-credential-management
  labels:
    app.kubernetes.io/name: secrets-and-credential-management
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: secrets-and-credential-management
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secrets-and-credential-management
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: secrets-and-credential-management
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8111
          env:
            - name: SECRETS_TENANT_ID
              value: {{ .Values.config.tenantId | quote }}
            - name: SECRETS_TELEMETRY__LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: SECRETS_TELEMETRY__OTLP_ENDPOINT
              value: {{ .Values.config.otlpEndpoint | quote }}
            - name: SECRETS_IDENTITY_ACCESS_BASE_URL
              value: {{ .Values.identityAccessBaseUrl | quote }}
            - name: SECRETS_AUDITABILITY_BASE_URL
              value: {{ .Values.auditabilityBaseUrl | quote }}
            {{- if .Values.secretsMasterKey.existingSecret }}
            - name: SECRETS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretsMasterKey.existingSecret }}
                  key: {{ .Values.secretsMasterKey.existingSecretKey }}
            {{- else }}
            - name: SECRETS_MASTER_KEY
              value: {{ .Values.secretsMasterKey.value | quote }}
            {{- end }}
            {{- if .Values.database.existingSecret }}
            - name: SECRETS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- else }}
            - name: SECRETS_DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
