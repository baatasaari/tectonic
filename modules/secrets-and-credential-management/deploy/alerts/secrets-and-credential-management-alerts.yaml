# Prometheus Alertmanager rule definitions for the Secrets and Credential
# Management module (LLD §Level 4 "Alerting").
groups:
  - name: secrets-and-credential-management
    rules:
      - alert: SecretsAccessDeniedRateHigh
        expr: sum(rate(secrets_access_total{allowed="False"}[5m])) * 60 > 10
        labels:
          severity: warning
        annotations:
          summary: "More than 10 denied secret retrieve() attempts per minute, sustained 5m"
          description: "Check the access log for the secret_id/tenant_id driving it -- could be a misconfigured caller or an actual attack against the vault."

      - alert: SecretsRotationComplianceLow
        expr: min(secrets_rotation_compliance_rate) < 0.8
        labels:
          severity: warning
        annotations:
          summary: "Rotation compliance below 80% for at least one tenant"
          description: "The LLD's own key metric -- a real, sustained drop means active secrets are going stale past their own rotation_interval_days."
