image:
  repository: tectonic/agent-marketplace
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: "250m"
    memory: 256Mi
  limits:
    cpu: "500m"
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  # Governance actions and catalogue search are lower-volume than the registries it sits
  # on top of (Agent Cards) -- a lighter autoscale ceiling than MCP/A2A/Agent Cards' own charts.
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

service:
  type: ClusterIP
  port: 8103

config:
  tenantId: "default"
  logLevel: "INFO"
  otlpEndpoint: "http://tempo:4317"

database:
  url: "postgresql+asyncpg://agent_marketplace:agent_marketplace@postgres:5432/agent_marketplace"
  existingSecret: ""
  existingSecretKey: "database-url"

agentCardsBaseUrl: "http://agent-cards:8102"
multiTenancyBaseUrl: "http://multi-tenancy:8109"

podDisruptionBudget:
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /healthz
    port: 8103
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: 8103
  initialDelaySeconds: 5
  periodSeconds: 10
