image:
  repository: tectonic/workflow-engine
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    cpu: "2"
    memory: 4Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  # Scale on queue depth (pending steps), not CPU alone — the workload is
  # I/O-bound (LLD §4.6). Requires a custom-metrics adapter exposing
  # workflow_instances_active{status="running"} or an equivalent queue-depth
  # signal to the HPA; falls back to CPU-only scaling if none is installed.
  targetCPUUtilizationPercentage: 70

service:
  type: ClusterIP
  port: 8080

config:
  tenantId: "default"
  logLevel: "INFO"
  otlpEndpoint: "http://tempo:4317"
  defaultConfidenceThreshold: 0.85
  maxParallelStepsPerInstance: 10
  replanningEnabled: true

database:
  url: "postgresql+asyncpg://workflow_engine:workflow_engine@postgres:5432/workflow_engine"
  existingSecret: ""
  existingSecretKey: "database-url"

kafka:
  bootstrapServers: "kafka:9092"

llmGatewayBaseUrl: "http://llm-gateway:8082"
toolOrchestrationBaseUrl: "http://tool-orchestration:8083"
guardrailsBaseUrl: "http://guardrails:8093"
humanOversightBaseUrl: "http://human-oversight:8095"

podDisruptionBudget:
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
