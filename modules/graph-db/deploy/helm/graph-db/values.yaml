image:
  repository: tectonic/graph-db
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 3

resources:
  requests:
    cpu: "1"
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

service:
  type: ClusterIP
  port: 8090

config:
  tenantId: "default"
  logLevel: "INFO"
  otlpEndpoint: "http://tempo:4317"
  maxTraversalDepth: 3
  rawCypherEnabled: false

database:
  url: "postgresql+asyncpg://graph_db:graph_db@postgres:5432/graph_db"
  existingSecret: ""
  existingSecretKey: "database-url"

auditabilityBaseUrl: "http://auditability:8099"
multiTenancyBaseUrl: "http://multi-tenancy:8109"

podDisruptionBudget:
  minAvailable: 2

livenessProbe:
  httpGet:
    path: /healthz
    port: 8090
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: 8090
  initialDelaySeconds: 5
  periodSeconds: 10
