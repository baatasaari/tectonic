apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-graph-db
  labels:
    app.kubernetes.io/name: graph-db
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: graph-db
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graph-db
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: graph-db
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: GRAPH_DB_TENANT_ID
              value: {{ .Values.config.tenantId | quote }}
            - name: GRAPH_DB_TELEMETRY__LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: GRAPH_DB_TELEMETRY__OTLP_ENDPOINT
              value: {{ .Values.config.otlpEndpoint | quote }}
            - name: GRAPH_DB_QUERY__DEFAULT_MAX_TRAVERSAL_DEPTH
              value: {{ .Values.config.maxTraversalDepth | quote }}
            - name: GRAPH_DB_QUERY__RAW_CYPHER_ENABLED
              value: {{ .Values.config.rawCypherEnabled | quote }}
            - name: GRAPH_DB_AUDITABILITY_BASE_URL
              value: {{ .Values.auditabilityBaseUrl | quote }}
            {{- if .Values.database.existingSecret }}
            - name: GRAPH_DB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- else }}
            - name: GRAPH_DB_DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
