# Deployability and Testability Contract: this module runs and tests fully
# standalone — it has no upstream module dependencies for its own core
# write/query operation, only Auditability as a best-effort outbound call
# (stubbed here). Real Postgres runs here (see the module README for why
# Postgres stands in for Neo4j/Memgraph).
name: graph-db

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: graph_db
      POSTGRES_PASSWORD: graph_db
      POSTGRES_DB: graph_db
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graph_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  dependency-stub:
    build: ../stubs/dependency-stub
    ports:
      - "9111:9111"

  migrate:
    build: ..
    command: ["alembic", "upgrade", "head"]
    environment:
      GRAPH_DB_DATABASE_URL: postgresql+asyncpg://graph_db:graph_db@postgres:5432/graph_db
    depends_on:
      postgres:
        condition: service_healthy

  graph-db:
    build: ..
    ports:
      - "8090:8090"
    environment:
      GRAPH_DB_DATABASE_URL: postgresql+asyncpg://graph_db:graph_db@postgres:5432/graph_db
      GRAPH_DB_AUDITABILITY_BASE_URL: http://dependency-stub:9111
    depends_on:
      postgres:
        condition: service_healthy
      dependency-stub:
        condition: service_started
      migrate:
        condition: service_completed_successfully
