apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-a2a
  labels:
    app.kubernetes.io/name: a2a
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: a2a
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: a2a
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-a2a
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: a2a
              app.kubernetes.io/instance: {{ .Release.Name }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: a2a
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8101
          env:
            - name: A2A_GATEWAY_TENANT_ID
              value: {{ .Values.config.tenantId | quote }}
            - name: A2A_GATEWAY_MULTI_TENANCY_BASE_URL
              value: {{ .Values.multiTenancyBaseUrl | quote }}
            - name: A2A_GATEWAY_TELEMETRY__LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: A2A_GATEWAY_TELEMETRY__OTLP_ENDPOINT
              value: {{ .Values.config.otlpEndpoint | quote }}
            - name: A2A_GATEWAY_AGENT_NAME
              value: {{ .Values.config.agentName | quote }}
            - name: A2A_GATEWAY_AGENT_DESCRIPTION
              value: {{ .Values.config.agentDescription | quote }}
            - name: A2A_GATEWAY_SELF_BASE_URL
              value: {{ .Values.config.selfBaseUrl | quote }}
            - name: A2A_GATEWAY_SKILL_DEFINITION_MAP
              value: {{ .Values.config.skillDefinitionMap | quote }}
            - name: A2A_GATEWAY_WORKFLOW_ENGINE_BASE_URL
              value: {{ .Values.workflowEngineBaseUrl | quote }}
            {{- if .Values.database.existingSecret }}
            - name: A2A_GATEWAY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- else }}
            - name: A2A_GATEWAY_DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
