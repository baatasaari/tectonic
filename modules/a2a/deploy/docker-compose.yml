# Deployability and Testability Contract: this module runs and tests fully
# standalone with both its outbound dependencies stubbed by the same
# dependency-stub service (an external A2A peer for outbound delegation, and
# a Workflow Engine stand-in for inbound dispatch). Real Postgres runs here.
name: a2a-gateway

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: a2a_gateway
      POSTGRES_PASSWORD: a2a_gateway
      POSTGRES_DB: a2a_gateway
    ports:
      - "5449:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a2a_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  dependency-stub:
    build: ../stubs/dependency-stub
    ports:
      - "9122:9122"

  migrate:
    build: ..
    command: ["alembic", "upgrade", "head"]
    environment:
      A2A_GATEWAY_DATABASE_URL: postgresql+asyncpg://a2a_gateway:a2a_gateway@postgres:5432/a2a_gateway
    depends_on:
      postgres:
        condition: service_healthy

  a2a-gateway:
    build: ..
    ports:
      - "8101:8101"
    environment:
      A2A_GATEWAY_DATABASE_URL: postgresql+asyncpg://a2a_gateway:a2a_gateway@postgres:5432/a2a_gateway
      A2A_GATEWAY_WORKFLOW_ENGINE_BASE_URL: http://dependency-stub:9122
      A2A_GATEWAY_MULTI_TENANCY_BASE_URL: http://dependency-stub:9122
      A2A_GATEWAY_SELF_BASE_URL: http://a2a-gateway:8101
      A2A_GATEWAY_SKILL_DEFINITION_MAP: '{"summarize": "def-summarize"}'
    depends_on:
      postgres:
        condition: service_healthy
      dependency-stub:
        condition: service_started
      migrate:
        condition: service_completed_successfully
