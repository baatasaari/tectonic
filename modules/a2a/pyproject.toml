[project]
name = "a2a-gateway"
version = "0.1.0"
description = "Tectonic Agentic AI Platform — Module 22: A2A. Standardised agent-to-agent delegation and capability negotiation, cross-vendor federation over the A2A protocol."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.30",
  "alembic>=1.13",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
  "httpx>=0.27",
  "tenacity>=9.0",
  "aiobreaker>=1.2",
  "pyjwt>=2.9",
  "pyyaml>=6.0",
  "greenlet>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "aiosqlite>=0.20",
  "respx>=0.21",
  "ruff>=0.7",
  "schemathesis>=3.35",
  "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a real Postgres (testcontainers/Docker, or TECTONIC_TEST_POSTGRES_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
