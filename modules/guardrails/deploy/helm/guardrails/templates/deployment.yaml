apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-guardrails
  labels:
    app.kubernetes.io/name: guardrails
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: guardrails
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guardrails
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: guardrails
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8093
          env:
            - name: GUARDRAILS_TENANT_ID
              value: {{ .Values.config.tenantId | quote }}
            - name: GUARDRAILS_MULTI_TENANCY_BASE_URL
              value: {{ .Values.multiTenancyBaseUrl | quote }}
            - name: GUARDRAILS_TELEMETRY__LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: GUARDRAILS_TELEMETRY__OTLP_ENDPOINT
              value: {{ .Values.config.otlpEndpoint | quote }}
            - name: GUARDRAILS_GROUNDEDNESS__THRESHOLD
              value: {{ .Values.config.groundednessThreshold | quote }}
            - name: GUARDRAILS_RED_TEAM__ENABLED
              value: {{ .Values.config.redTeamEnabled | quote }}
            - name: GUARDRAILS_LLM_GATEWAY_BASE_URL
              value: {{ .Values.llmGatewayBaseUrl | quote }}
            - name: GUARDRAILS_SENTINEL_AGENTS_BASE_URL
              value: {{ .Values.sentinelAgentsBaseUrl | quote }}
            {{- if .Values.database.existingSecret }}
            - name: GUARDRAILS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- else }}
            - name: GUARDRAILS_DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
