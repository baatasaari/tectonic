apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-sentinel-agents
  labels:
    app.kubernetes.io/name: sentinel-agents
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-agents
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-agents
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: sentinel-agents
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8094
          env:
            - name: SENTINEL_AGENTS_TENANT_ID
              value: {{ .Values.config.tenantId | quote }}
            - name: SENTINEL_AGENTS_MULTI_TENANCY_BASE_URL
              value: {{ .Values.multiTenancyBaseUrl | quote }}
            - name: SENTINEL_AGENTS_TELEMETRY__LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: SENTINEL_AGENTS_TELEMETRY__OTLP_ENDPOINT
              value: {{ .Values.config.otlpEndpoint | quote }}
            - name: SENTINEL_AGENTS_BASELINING__SENSITIVITY
              value: {{ .Values.config.sensitivity | quote }}
            - name: SENTINEL_AGENTS_SWARM_DETECTION__ENABLED
              value: {{ .Values.config.swarmDetectionEnabled | quote }}
            - name: SENTINEL_AGENTS_WORKFLOW_ENGINE_BASE_URL
              value: {{ .Values.workflowEngineBaseUrl | quote }}
            - name: SENTINEL_AGENTS_TOOL_ORCHESTRATION_BASE_URL
              value: {{ .Values.toolOrchestrationBaseUrl | quote }}
            - name: SENTINEL_AGENTS_HUMAN_OVERSIGHT_BASE_URL
              value: {{ .Values.humanOversightBaseUrl | quote }}
            - name: SENTINEL_AGENTS_AUDITABILITY_BASE_URL
              value: {{ .Values.auditabilityBaseUrl | quote }}
            {{- if .Values.database.existingSecret }}
            - name: SENTINEL_AGENTS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- else }}
            - name: SENTINEL_AGENTS_DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
