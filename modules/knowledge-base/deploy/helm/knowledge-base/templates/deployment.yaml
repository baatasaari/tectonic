apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-knowledge-base
  labels:
    app.kubernetes.io/name: knowledge-base
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: knowledge-base
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowledge-base
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: knowledge-base
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8088
          env:
            - name: KNOWLEDGE_BASE_TENANT_ID
              value: {{ .Values.config.tenantId | quote }}
            - name: KNOWLEDGE_BASE_TELEMETRY__LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: KNOWLEDGE_BASE_TELEMETRY__OTLP_ENDPOINT
              value: {{ .Values.config.otlpEndpoint | quote }}
            - name: KNOWLEDGE_BASE_CHUNKING__DEFAULT_STRATEGY
              value: {{ .Values.config.defaultChunkingStrategy | quote }}
            - name: KNOWLEDGE_BASE_STALENESS__DEFAULT_THRESHOLD_DAYS
              value: {{ .Values.config.staleThresholdDays | quote }}
            {{- if .Values.dependencyStubBaseUrl }}
            - name: KNOWLEDGE_BASE_DEPENDENCY_STUB_BASE_URL
              value: {{ .Values.dependencyStubBaseUrl | quote }}
            {{- end }}
            {{- if .Values.database.existingSecret }}
            - name: KNOWLEDGE_BASE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- else }}
            - name: KNOWLEDGE_BASE_DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
