image:
  repository: tectonic/knowledge-base
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 3

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

service:
  type: ClusterIP
  port: 8088

config:
  tenantId: "default"
  logLevel: "INFO"
  otlpEndpoint: "http://tempo:4317"
  defaultChunkingStrategy: "semantic"
  staleThresholdDays: 180

database:
  url: "postgresql+asyncpg://knowledge_base:knowledge_base@postgres:5432/knowledge_base"
  existingSecret: ""
  existingSecretKey: "database-url"

dependencyStubBaseUrl: ""  # set to a real Vector DB + Graph DB URL once deployed

podDisruptionBudget:
  minAvailable: 2

livenessProbe:
  httpGet:
    path: /healthz
    port: 8088
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: 8088
  initialDelaySeconds: 5
  periodSeconds: 10
