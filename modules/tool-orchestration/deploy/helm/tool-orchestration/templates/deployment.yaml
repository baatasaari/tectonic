apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-tool-orchestration
  labels:
    app.kubernetes.io/name: tool-orchestration
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: tool-orchestration
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tool-orchestration
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: tool-orchestration
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: TOOL_ORCHESTRATION_TENANT_ID
              value: {{ .Values.config.tenantId | quote }}
            - name: TOOL_ORCHESTRATION_MULTI_TENANCY_BASE_URL
              value: {{ .Values.multiTenancyBaseUrl | quote }}
            - name: TOOL_ORCHESTRATION_TELEMETRY__LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: TOOL_ORCHESTRATION_TELEMETRY__OTLP_ENDPOINT
              value: {{ .Values.config.otlpEndpoint | quote }}
            - name: TOOL_ORCHESTRATION_CIRCUIT_BREAKER__FAILURE_THRESHOLD
              value: {{ .Values.config.circuitBreakerFailureThreshold | quote }}
            - name: TOOL_ORCHESTRATION_SYNTHESIS__ENABLED
              value: {{ .Values.config.synthesisEnabled | quote }}
            - name: TOOL_ORCHESTRATION_REDIS_URL
              value: {{ .Values.redis.url | quote }}
            - name: TOOL_ORCHESTRATION_LLM_GATEWAY_BASE_URL
              value: {{ .Values.llmGatewayBaseUrl | quote }}
            - name: TOOL_ORCHESTRATION_GUARDRAILS_BASE_URL
              value: {{ .Values.guardrailsBaseUrl | quote }}
            - name: TOOL_ORCHESTRATION_SENTINEL_AGENTS_BASE_URL
              value: {{ .Values.sentinelAgentsBaseUrl | quote }}
            {{- if .Values.database.existingSecret }}
            - name: TOOL_ORCHESTRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- else }}
            - name: TOOL_ORCHESTRATION_DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
