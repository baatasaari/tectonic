image:
  repository: tectonic/evaluation-framework
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 3

resources:
  requests:
    cpu: "500m"
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

service:
  type: ClusterIP
  port: 8097

config:
  tenantId: "default"
  logLevel: "INFO"
  otlpEndpoint: "http://tempo:4317"
  sampleRate: "0.05"
  productionSamplingEnabled: true

database:
  url: "postgresql+asyncpg://evalfw:evalfw@postgres:5432/evalfw"
  existingSecret: ""
  existingSecretKey: "database-url"

llmGatewayBaseUrl: "http://llm-gateway:8082"

podDisruptionBudget:
  minAvailable: 2

livenessProbe:
  httpGet:
    path: /healthz
    port: 8097
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: 8097
  initialDelaySeconds: 5
  periodSeconds: 10
