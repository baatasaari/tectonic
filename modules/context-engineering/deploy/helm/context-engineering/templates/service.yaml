apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-context-engineering
  labels:
    app.kubernetes.io/name: context-engineering
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: context-engineering
    app.kubernetes.io/instance: {{ .Release.Name }}
