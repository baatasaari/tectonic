image:
  repository: tectonic/context-engineering
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 3

resources:
  requests:
    cpu: "1"
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

service:
  type: ClusterIP
  port: 8086

config:
  tenantId: "default"
  logLevel: "INFO"
  otlpEndpoint: "http://tempo:4317"
  defaultTokenBudget: 4000
  summarisationEnabled: true

database:
  url: "postgresql+asyncpg://context_engineering:context_engineering@postgres:5432/context_engineering"
  existingSecret: ""
  existingSecretKey: "database-url"

llmGatewayBaseUrl: "http://llm-gateway:8082"
evaluationFrameworkBaseUrl: "http://evaluation-framework:8097"

podDisruptionBudget:
  minAvailable: 2

livenessProbe:
  httpGet:
    path: /healthz
    port: 8086
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: 8086
  initialDelaySeconds: 5
  periodSeconds: 10
