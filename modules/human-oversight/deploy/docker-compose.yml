# Deployability and Testability Contract: this module runs and tests fully
# standalone; calling modules are stubbed as request originators, and this
# module's own notification channels/callback destination point at the
# dependency-stub. Real Postgres runs here.
name: human-oversight

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: human_oversight
      POSTGRES_PASSWORD: human_oversight
      POSTGRES_DB: human_oversight
    ports:
      - "5445:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U human_oversight"]
      interval: 5s
      timeout: 5s
      retries: 10

  dependency-stub:
    build: ../stubs/dependency-stub
    ports:
      - "9116:9116"

  migrate:
    build: ..
    command: ["alembic", "upgrade", "head"]
    environment:
      HUMAN_OVERSIGHT_DATABASE_URL: postgresql+asyncpg://human_oversight:human_oversight@postgres:5432/human_oversight
    depends_on:
      postgres:
        condition: service_healthy

  human-oversight:
    build: ..
    ports:
      - "8095:8095"
    environment:
      HUMAN_OVERSIGHT_DATABASE_URL: postgresql+asyncpg://human_oversight:human_oversight@postgres:5432/human_oversight
      HUMAN_OVERSIGHT_AUDITABILITY_BASE_URL: http://dependency-stub:9116
      HUMAN_OVERSIGHT_NOTIFICATION_STUB_BASE_URL: http://dependency-stub:9116
      HUMAN_OVERSIGHT_MULTI_TENANCY_BASE_URL: http://dependency-stub:9116
      # pydantic-settings parses a dict[str, str] field from a JSON-encoded env var --
      # only workflow-engine is listed since that's the only callback route the stub
      # below actually implements; config.py's own _default_service_urls() (the full
      # 34-module directory) is this field's default when the env var is unset.
      HUMAN_OVERSIGHT_SERVICE_URLS: '{"workflow-engine": "http://dependency-stub:9116"}'
    depends_on:
      postgres:
        condition: service_healthy
      dependency-stub:
        condition: service_started
      migrate:
        condition: service_completed_successfully
