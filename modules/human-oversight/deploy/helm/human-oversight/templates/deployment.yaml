apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-human-oversight
  labels:
    app.kubernetes.io/name: human-oversight
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: human-oversight
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: human-oversight
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: human-oversight
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8095
          env:
            - name: HUMAN_OVERSIGHT_TENANT_ID
              value: {{ .Values.config.tenantId | quote }}
            - name: HUMAN_OVERSIGHT_TELEMETRY__LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: HUMAN_OVERSIGHT_TELEMETRY__OTLP_ENDPOINT
              value: {{ .Values.config.otlpEndpoint | quote }}
            - name: HUMAN_OVERSIGHT_QUEUE__DEFAULT_TIMEOUT_SECONDS
              value: {{ .Values.config.defaultTimeoutSeconds | quote }}
            - name: HUMAN_OVERSIGHT_AUDITABILITY_BASE_URL
              value: {{ .Values.auditabilityBaseUrl | quote }}
            {{- if .Values.notificationStubBaseUrl }}
            - name: HUMAN_OVERSIGHT_NOTIFICATION_STUB_BASE_URL
              value: {{ .Values.notificationStubBaseUrl | quote }}
            {{- end }}
            - name: HUMAN_OVERSIGHT_SERVICE_URLS
              value: {{ .Values.serviceUrls | toJson | quote }}
            {{- if .Values.database.existingSecret }}
            - name: HUMAN_OVERSIGHT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- else }}
            - name: HUMAN_OVERSIGHT_DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
