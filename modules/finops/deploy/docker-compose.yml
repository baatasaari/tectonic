# Deployability and Testability Contract: this module runs and tests fully
# standalone with LLM Gateway's own GET /admin/virtual-keys + GET
# /admin/budgets/{id} stubbed by a dependency-stub service. Real Postgres
# runs here.
name: finops

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: finops
      POSTGRES_DB: finops
    ports:
      - "5453:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finops"]
      interval: 5s
      timeout: 5s
      retries: 10

  dependency-stub:
    build: ../stubs/dependency-stub
    ports:
      - "9126:9126"

  migrate:
    build: ..
    command: ["alembic", "upgrade", "head"]
    environment:
      FINOPS_DATABASE_URL: postgresql+asyncpg://finops:finops@postgres:5432/finops
    depends_on:
      postgres:
        condition: service_healthy

  finops:
    build: ..
    ports:
      - "8105:8105"
    environment:
      FINOPS_DATABASE_URL: postgresql+asyncpg://finops:finops@postgres:5432/finops
      FINOPS_LLM_GATEWAY_BASE_URL: http://dependency-stub:9126
      FINOPS_MULTI_TENANCY_BASE_URL: http://dependency-stub:9126
    depends_on:
      postgres:
        condition: service_healthy
      dependency-stub:
        condition: service_started
      migrate:
        condition: service_completed_successfully
