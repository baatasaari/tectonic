# Deployability and Testability Contract: this module runs and tests fully
# standalone with Evaluation Framework's own GET /scores stubbed by a
# dependency-stub service. Real Postgres runs here.
name: llmops

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: llmops
      POSTGRES_PASSWORD: llmops
      POSTGRES_DB: llmops
    ports:
      - "5452:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmops"]
      interval: 5s
      timeout: 5s
      retries: 10

  dependency-stub:
    build: ../stubs/dependency-stub
    ports:
      - "9125:9125"

  migrate:
    build: ..
    command: ["alembic", "upgrade", "head"]
    environment:
      LLMOPS_DATABASE_URL: postgresql+asyncpg://llmops:llmops@postgres:5432/llmops
    depends_on:
      postgres:
        condition: service_healthy

  llmops:
    build: ..
    ports:
      - "8104:8104"
    environment:
      LLMOPS_DATABASE_URL: postgresql+asyncpg://llmops:llmops@postgres:5432/llmops
      LLMOPS_EVALUATION_FRAMEWORK_BASE_URL: http://dependency-stub:9125
    depends_on:
      postgres:
        condition: service_healthy
      dependency-stub:
        condition: service_started
      migrate:
        condition: service_completed_successfully
