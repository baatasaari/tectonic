apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-conversational-engine
  labels:
    app.kubernetes.io/name: conversational-engine
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: conversational-engine
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: conversational-engine
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: conversational-engine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: CONVERSATIONAL_ENGINE_TENANT_ID
              value: {{ .Values.config.tenantId | quote }}
            - name: CONVERSATIONAL_ENGINE_TELEMETRY__LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: CONVERSATIONAL_ENGINE_TELEMETRY__OTLP_ENDPOINT
              value: {{ .Values.config.otlpEndpoint | quote }}
            - name: CONVERSATIONAL_ENGINE_SESSION__TTL_SECONDS
              value: {{ .Values.config.sessionTtlSeconds | quote }}
            - name: CONVERSATIONAL_ENGINE_HANDOFF__EMOTION_SCORE_THRESHOLD
              value: {{ .Values.config.emotionScoreThreshold | quote }}
            - name: CONVERSATIONAL_ENGINE_STREAMING__PROTOCOL
              value: {{ .Values.config.streamingProtocol | quote }}
            - name: CONVERSATIONAL_ENGINE_REDIS_URL
              value: {{ .Values.redis.url | quote }}
            {{- if .Values.dependencyStubBaseUrl }}
            - name: CONVERSATIONAL_ENGINE_DEPENDENCY_STUB_BASE_URL
              value: {{ .Values.dependencyStubBaseUrl | quote }}
            {{- end }}
            {{- if .Values.database.existingSecret }}
            - name: CONVERSATIONAL_ENGINE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- else }}
            - name: CONVERSATIONAL_ENGINE_DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
