# Prometheus Alertmanager rule definitions for the Conversational Engine
# module (LLD §Level 4 "Alerting"). Routing left to the customer's own
# Alertmanager configuration.
groups:
  - name: conversational-engine
    rules:
      - alert: ConversationTimeToFirstTokenHigh
        expr: histogram_quantile(0.95, sum(rate(conversation_time_to_first_token_seconds_bucket[5m])) by (le, tenant_id)) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Time-to-first-token p95 above 300ms for tenant {{ $labels.tenant_id }}"

      - alert: ConversationHandoffRateSpike
        expr: |
          sum(rate(conversation_handoff_total[15m])) by (tenant_id)
            > 2 * sum(rate(conversation_handoff_total[24h])) by (tenant_id) / (24*60/15)
        labels:
          severity: warning
        annotations:
          summary: "Handoff rate for tenant {{ $labels.tenant_id }} more than 2x its 24h baseline"

      - alert: ConversationRefusalRateHigh
        expr: |
          sum(rate(conversation_turns_total{outcome="refused"}[15m])) by (tenant_id)
            /
          sum(rate(conversation_turns_total[15m])) by (tenant_id)
          > 0.10
        labels:
          severity: warning
        annotations:
          summary: "Refused-turn ratio above 10% for tenant {{ $labels.tenant_id }}"
          description: "May indicate a guardrail misconfiguration rather than bad behaviour — investigate before tuning policy."
