[project]
name = "tectonic-product-slices"
version = "0.1.0"
description = "Ticket #82: the platform's own product-slice integration tests -- real HTTP conversations against a real, fully-live 15-module + mock-external-systems stack (scripts/product-slice-stubs/), not any one module's own unit/integration/contract tier. See docs/phase2-product-slice-01-support-agent.md. Not an installable package (no src/ layout, no [build-system]) -- see this directory's own README for the flat `uv pip install` command that actually sets it up."
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["product_slice: real, live multi-process product-slice test (slow; see conftest.py)"]
